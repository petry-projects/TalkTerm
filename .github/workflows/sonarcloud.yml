# SonarCloud code quality, maintainability, and security hotspot scanning.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md#3-sonarcloud-analysis-sonarcloudyml
name: SonarCloud Analysis

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SHA-scoped so each commit keeps its own slot (per org ci-standards). This
# dedupes the duplicate pull_request runs GitHub occasionally emits for one
# commit: without it, one sibling runs while the other lingers as
# `action_required`, which the fleet monitor counts as a failure. The prefix
# keeps this group distinct from ci.yml's.
concurrency:
  group: sonarcloud-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # First attempt. continue-on-error lets the retry step below recover from
      # any failure (introduced for transient 403/5xx responses from
      # binaries.sonarsource.com during scanner CLI download) without failing
      # the job on a single blip.
      - name: SonarCloud Scan
        id: sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true
      # Retry once on any failure of the first attempt. Only re-runs on
      # failure so a healthy first attempt is never scanned twice.
      - name: SonarCloud Scan (retry)
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
