# Feature Ideation — TalkTerm caller stub.
#
# Calls the org-wide reusable workflow at
# petry-projects/.github/.github/workflows/feature-ideation-reusable.yml
# All ideation logic, the multi-skill pipeline, the Opus 4.6 model
# selection, and the github_token override live in the reusable workflow.
#
# To tune the prompt or pipeline for ALL BMAD repos, edit the reusable
# workflow in petry-projects/.github — changes propagate here on next run.
#
# To customise THIS repo's project context, edit the project_context value
# below. That is the only TalkTerm-specific thing in this file.
#
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md#8-feature-ideation-feature-ideationyml--bmad-method-repos
name: Feature Research & Ideation (BMAD Analyst)

on:
  schedule:
    - cron: '0 7 * * 5'   # Friday 07:00 UTC (3 AM EDT / 2 AM EST)
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Optional focus area (e.g., "accessibility", "voice UX", "performance")'
        required: false
        type: string
      research_depth:
        description: 'Research depth'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - deep

permissions: {}

concurrency:
  group: feature-ideation
  cancel-in-progress: false

jobs:
  ideate:
    # Permissions cascade from the calling job to the reusable workflow.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: write
      id-token: write
      actions: read
    uses: petry-projects/.github/.github/workflows/feature-ideation-reusable.yml@ce8a8c328b21feb26c7bb9ef81ffb26354e9a4da # v1
    with:
      # === CUSTOMISE THIS PER REPO — the only required edit ===
      # Replace this paragraph with a 3-5 sentence description of your project,
      # its target users, and the competitive landscape. The more specific you
      # are, the more useful the proposals.
      project_context: |
        TalkTerm is a desktop AI agent interface (Electron + React + TypeScript)
        that makes CLI-based agentic workflows accessible to non-technical users
        through voice-enabled animated avatars, with the Claude Agent SDK running
        in-process in the Electron main process. Target users are non-technical
        knowledge workers who need AI assistance without command-line expertise.
        Competitors include voice-first AI assistants (e.g., Siri, Copilot,
        Gemini) and developer-focused CLI tools (e.g., Claude Code, GitHub
        Copilot CLI). Key emerging trends: multimodal AI interfaces, ambient
        computing, and agentic task automation.
      # === OPTIONAL: repo-local reputable source list ===
      # Copy standards/feature-ideation-sources.md from petry-projects/.github
      # to .github/feature-ideation-sources.md and customise it. The reusable
      # workflow defaults to that path, so you only need to uncomment and change
      # sources_file below if you store the list somewhere else.
      # sources_file: 'docs/feature-ideation-sources.md'
      focus_area: ${{ inputs.focus_area || '' }}
      research_depth: ${{ inputs.research_depth || 'standard' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
