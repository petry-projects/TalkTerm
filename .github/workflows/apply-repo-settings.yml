# ─────────────────────────────────────────────────────────────────────────────
# Standard: petry-projects/.github/standards/push-protection.md#required-repo-level-settings
#
# Applies repository-level security settings (secret_scanning_ai_detection, etc.)
# via scripts/apply-repo-settings.sh when .github/settings.yml or scripts/apply-repo-settings.sh
# change, or manually via workflow_dispatch. Triggered narrowly to avoid excess runs while a
# PAT/GitHub App token with admin rights is configured for repository settings modifications.
#
# Note: Currently limited to GITHUB_TOKEN permissions. Use GitHub App or PAT token with
# admin scope for unrestricted repository-level settings modifications.
# ─────────────────────────────────────────────────────────────────────────────
name: Apply repo settings

on:
  push:
    branches: [main]
    paths:
      - .github/settings.yml
      - scripts/apply-repo-settings.sh
      - .github/workflows/apply-repo-settings.yml
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — reinforce settings to prevent drift
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    name: Apply security_and_analysis settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned to SHA per Action Pinning Policy
        # (petry-projects/.github/standards/ci-standards.md#action-pinning-policy).
        # Refresh: gh api repos/actions/checkout/git/refs/tags/v6.0.2 --jq '.object.sha'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Apply settings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/apply-repo-settings.sh
