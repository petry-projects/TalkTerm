# ─────────────────────────────────────────────────────────────────────────────
# Standard: petry-projects/.github/standards/push-protection.md#required-repo-level-settings
#
# Applies repository-level security settings (secret_scanning_ai_detection, etc.)
# via scripts/apply-repo-settings.sh on every push to main so that
# security_and_analysis settings documented in .github/settings.yml stay in
# effect. Also triggerable manually for out-of-band remediation.
#
# Token: GH_PAT_WORKFLOWS (classic PAT with repo scope).
# `administration` is not a valid GITHUB_TOKEN scope in Actions; and the
# check-suites/preferences endpoint requires a classic PAT (OAuth tokens are
# rejected). See standards/github-settings.md#check-suite-auto-trigger-preferences.
# ─────────────────────────────────────────────────────────────────────────────
name: Apply repo settings

on:
  push:
    branches: [main]
    paths:
      - .github/settings.yml
      - scripts/apply-repo-settings.sh
      - .github/workflows/apply-repo-settings.yml
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — re-enforce settings to prevent drift
  workflow_dispatch:

permissions: {}

jobs:
  apply:
    name: Apply security_and_analysis settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned to SHA per Action Pinning Policy
        # (petry-projects/.github/standards/ci-standards.md#action-pinning-policy).
        # Refresh: gh api repos/actions/checkout/git/refs/tags/v6.0.2 --jq '.object.sha'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Apply settings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/apply-repo-settings.sh
